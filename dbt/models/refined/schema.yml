version: 2

sources:
  - name: raw
    database: WORKDAY_DB
    schema: RAW
    tables:
      - name: workers
        description: "Raw worker records from Workday API as VARIANT"
      - name: job_changes
        description: "Raw job change events (hires, promotions, transfers, terms)"
      - name: compensation
        description: "Raw compensation records"
      - name: organizations
        description: "Raw organization hierarchy"
      - name: positions
        description: "Raw position catalog"
      - name: time_off
        description: "Raw time off / leave records"

models:
  - name: stg_workers
    description: "Flattened worker records with personal, employment, and position data"
    columns:
      - name: worker_id
        tests: [unique, not_null]
      - name: employment_status
        tests:
          - accepted_values:
              values: ['Active', 'Terminated']

  - name: stg_job_changes
    description: "Flattened job change events"
    columns:
      - name: change_id
        tests: [unique, not_null]
      - name: worker_id
        tests: [not_null]
      - name: change_type
        tests:
          - accepted_values:
              values: ['New Hire', 'Promotion', 'Transfer', 'Termination']

  - name: stg_compensation
    description: "Flattened compensation records"
    columns:
      - name: compensation_id
        tests: [unique, not_null]
      - name: worker_id
        tests: [not_null]
      - name: base_salary
        tests: [not_null]
