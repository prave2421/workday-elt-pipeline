version: 2

sources:
  - name: raw
    database: WORKDAY_DB
    schema: RAW
    tables:
      - name: workers
      - name: job_changes
      - name: compensation
      - name: organizations
      - name: positions
      - name: time_off

models:
  - name: stg_workers
    description: "Flattened worker records"
    columns:
      - name: worker_id
        data_tests:
          - unique
          - not_null
      - name: employment_status
        data_tests:
          - accepted_values:
              values: ['Active', 'Terminated']

  - name: stg_job_changes
    description: "Flattened job change events"
    columns:
      - name: change_id
        data_tests:
          - unique
          - not_null
      - name: worker_id
        data_tests:
          - not_null

  - name: stg_compensation
    description: "Flattened compensation records"
    columns:
      - name: compensation_id
        data_tests:
          - unique
          - not_null
      - name: worker_id
        data_tests:
          - not_null
