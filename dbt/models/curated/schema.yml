version: 2

models:
  - name: dim_worker
    description: "SCD Type 2 worker dimension"
    columns:
      - name: worker_dim_key
        data_tests:
          - not_null
      - name: worker_id
        data_tests:
          - not_null

  - name: dim_org
    description: "Organization dimension"
    columns:
      - name: org_key
        data_tests:
          - unique
          - not_null

  - name: fct_headcount_daily
    description: "Daily headcount"
    columns:
      - name: report_date
        data_tests:
          - not_null

  - name: fct_compensation
    description: "Compensation history"
    columns:
      - name: compensation_id
        data_tests:
          - unique
          - not_null
